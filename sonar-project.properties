sonar.projectKey=Vialtros-ORG_Vialtros
sonar.organization=vialtros-org
sonar.projectName=Vialtros
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src,.github/workflows
sonar.exclusions=**/migrations/**,**/node_modules/**,**/build/**,**/coverage/**,**/staticfiles/**,**/__pycache__/**,**/*.min.js,**/*.lock,**/*.test.js
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
# S8544 currently misreads pip's `:all:` option as an unpinned dependency.
# requirements-ci.txt pins every package installed by this workflow.
sonar.issue.ignore.multicriteria=ciPipLockFalsePositive
sonar.issue.ignore.multicriteria.ciPipLockFalsePositive.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.ciPipLockFalsePositive.resourceKey=.github/workflows/sonarqube.yml
