name: SonarQube

on:
  pull_request:
    # Ejecutar en toda PR, sin filtrar por rama destino o rutas modificadas.
    # Los filtros por rutas omiten PR que solo cambian configuración o documentación,
    # y `branches` puede dejar fuera PR hacia otras ramas.
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze code
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate an ephemeral Django key
        shell: bash
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Build backend image for coverage
        run: docker build -t vialtros-sonar-backend ./backend

      - name: Run backend tests with coverage
        run: |
          mkdir -p backend/coverage-output
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh \
            -v "$GITHUB_WORKSPACE/backend/coverage-output:/coverage" \
            -e HOME=/tmp \
            -e DJANGO_SECRET_KEY \
            vialtros-sonar-backend \
            -c "python -m pip install --only-binary=:all: coverage==7.10.6 && python -m coverage run --branch --source=core,tracking,users manage.py test && python -m coverage xml -o /coverage/coverage.xml"

      - name: Normalize backend coverage paths for Sonar
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("backend/coverage-output/coverage.xml")
          tree = ET.parse(report)
          root = tree.getroot()
          sources = root.find("sources")
          if sources is not None:
              for source in sources:
                  source.text = os.environ["GITHUB_WORKSPACE"]
          for item in root.iter("class"):
              filename = item.get("filename", "")
              if filename and not filename.startswith("backend/"):
                  item.set("filename", f"backend/{filename}")
          tree.write(report, encoding="utf-8", xml_declaration=True)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

      - name: Normalize frontend coverage paths for repository root
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path("frontend/coverage/lcov.info")
          lines = report.read_text(encoding="utf-8").splitlines()
          normalized = []
          for line in lines:
              if line.startswith("SF:"):
                  source = line[3:].replace("\\", "/")
                  if source.startswith("src/"):
                      source = f"frontend/{source}"
                  line = f"SF:{source}"
              normalized.append(line)
          report.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
