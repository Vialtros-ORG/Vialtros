name: SonarQube

on:
  pull_request:
    # Ejecutar en toda PR, sin filtrar por rama destino o rutas modificadas.
    # Los filtros por rutas omiten PR que solo cambian configuración o documentación,
    # y `branches` puede dejar fuera PR hacia otras ramas.
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies and coverage
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage

      - name: Generate an ephemeral Django key
        shell: bash
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          coverage run --branch --source=core,tracking,users manage.py test
          coverage xml -o coverage.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true

      - name: Normalize frontend coverage paths for repository root
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path("frontend/coverage/lcov.info")
          lines = report.read_text(encoding="utf-8").splitlines()
          normalized = []
          for line in lines:
              if line.startswith("SF:"):
                  source = line[3:].replace("\\", "/")
                  if source.startswith("src/"):
                      source = f"frontend/{source}"
                  line = f"SF:{source}"
              normalized.append(line)
          report.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
